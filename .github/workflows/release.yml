name: "release-actions"

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID_ADMIN_GITHUB }}
          private_key: ${{ secrets.APP_PRIVATE_KEY_ADMIN_GITHUB }}
          
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          
      - name: Set RELEASE_VERSION from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "Release version: ${TAG#v}"
        shell: bash
        
      - name: Upgrade gradle.properties
        run: sed -i "s/^version=.*/version=${RELEASE_VERSION}/g" gradle.properties
        shell: bash
        
      - name: Generate Changelog
        uses: heinrichreimer/github-changelog-generator-action@v2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pullRequests: true
          prWoLabels: true
          issues: true
          issuesWoLabels: true
          stripGeneratorNotice: true
          
      - name: Save version
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          push-branch: "main"
          commit-message: 'chore(release): update version to ${{ env.RELEASE_VERSION }} [skip ci]'
          force-add: "true"
          files: CHANGELOG.md gradle.properties
          name: Release Bot
          email: release-bot@bancolombia.com.co
          rebase: "true"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Publish Libraries to Maven Central
        shell: bash
        run: |
          set -euo pipefail
          # Ya no pasamos las llaves con -P aquí para evitar romper el formato
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository \
            -Pversion=${{ env.RELEASE_VERSION }} \
            --no-daemon \
            --stacktrace
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE: ${{ secrets.SIGNING_KEY_FILE }}
          
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SECRET_MAVEN_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SECRET_MAVEN_PASSWORD }}

      - name: Publish co.com.bancolombia relocation to Maven Central
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository \
            -PpublishLegacy=true \
            -Pversion=${{ env.RELEASE_VERSION }} \
            --no-daemon \
            --stacktrace
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE: ${{ secrets.SIGNING_KEY_FILE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SECRET_MAVEN_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SECRET_MAVEN_PASSWORD }}

      - name: Verify same version in both groups
        shell: bash
        run: |
          V=${{ env.RELEASE_VERSION }}
          for m in ecs-model ecs-core ecs-imperative ecs-reactive; do
            ok=0
            for i in $(seq 1 30); do
              a=$(curl -s -o /dev/null -w "%{http_code}" https://repo1.maven.org/maven2/com/github/bancolombia/$m/$V/$m-$V.pom)
              b=$(curl -s -o /dev/null -w "%{http_code}" https://repo1.maven.org/maven2/co/com/bancolombia/$m/$V/$m-$V.pom)
              if [ "$a" = "200" ] && [ "$b" = "200" ]; then ok=1; break; fi
              sleep 60
            done
            [ "$ok" = "1" ] || { echo "Falta $m $V en alguno de los grupos"; exit 1; }
          done
