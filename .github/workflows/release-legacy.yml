name: release-legacy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin v (ej. 2.1.7)"
        required: true

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish co.com.bancolombia relocation to Maven Central
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository \
            -PpublishLegacy=true \
            -Pversion=${{ inputs.version }} \
            --no-daemon \
            --stacktrace
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE: ${{ secrets.SIGNING_KEY_FILE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SECRET_MAVEN_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SECRET_MAVEN_PASSWORD }}
